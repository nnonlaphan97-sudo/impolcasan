
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>POLCASAN'S PHONE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#0e0e12;
  font-family:"Noto Sans Thai","Roboto",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
  cursor:pointer;
}

#stage{
  width:100%;
  height:100vh;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Samsung Galaxy Z Fold exterior */

.phone{
  position:relative;
  width:min(100vw,calc(100dvh * .57),513px);
  aspect-ratio:0.57;
  flex-shrink:0;

  background:linear-gradient(
    90deg,
    #94899F 0%,
    #C4B9CE 3%,
    #B7AAC4 50%,
    #D0C5D6 97%,
    #91859B 100%
  );

  border:1px solid #8E839B;
  border-radius:12px;
  padding:3px;

  box-shadow:
    inset 1px 0 1px #E9E1EC,
    inset -1px 0 1px #81758C,
    0 8px 25px rgba(0,0,0,.25);
}

.bezel{
  position:relative;
  width:100%;
  height:100%;
  padding:3px;
  background:#0B0B0F;
  border-radius:9px;
  overflow:hidden;
}

.screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:6px;
  background:#18151c;
}

.wallpaper{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  user-select:none;
  pointer-events:none;
}

.tint{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.20) 0%,
    rgba(0,0,0,.03) 29%,
    transparent 55%,
    rgba(0,0,0,.18) 100%
  );
  pointer-events:none;
}

/* Front camera */

.camera-hole{
  position:absolute;
  top:13px;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:12px;
  border-radius:50%;
  background:#0a0c12;
  border:2px solid #303644;
  box-shadow:0 0 0 1px #101219;
  z-index:10;
}

/* Status bar */

.status{
  position:absolute;
  top:14px;
  left:0;
  right:0;
  padding:0 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
  z-index:9;
  font-size:clamp(11px,3.1vw,15px);
  font-weight:600;
  text-shadow:0 1px 3px #0005;
}

.status-right{
  display:flex;
  align-items:center;
  gap:5px;
}

.status svg{
  display:block;
  flex-shrink:0;
}

/* Date and time */

.clock-area{
  position:absolute;
  top:25%;
  left:0;
  right:0;
  text-align:center;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.3);
}

.lock-icon{
  position:absolute;
  top:9%;
  left:50%;
  transform:translateX(-50%);
  width:19px;
  height:23px;
  margin:0;
  z-index:12;
  pointer-events:none;
}
.date{
  font-size:clamp(14px,4vw,22px);
  font-weight:400;
}

.time{
  font-size:clamp(64px,18vw,105px);
  font-weight:800;
  letter-spacing:-5px;
  line-height:1.16;
  font-variant-numeric:tabular-nums;
}

/* Bottom shortcuts */

.bottom{
  position:absolute;
  bottom:6.5%;
  left:0;
  right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8%;
}

.shortcut{
  width:56px;
  height:56px;
  border-radius:50%;
  background:rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.18);
  display:grid;
  place-items:center;
  backdrop-filter:blur(8px);
  transition:transform .15s,background .15s;
}

.shortcut:active{
  transform:scale(.9);
  background:rgba(255,255,255,.35);
}

.gesture{
  position:absolute;
  bottom:13px;
  left:50%;
  transform:translateX(-50%);
  width:30%;
  height:5px;
  background:#fff;
  border-radius:10px;
  opacity:.9;
}

/* Side hardware buttons */

.side-button{
  position:absolute;
  right:0;
  top:26%;
  width:44px;
  height:70px;
  background:transparent;
  border:0;
  padding:0;
  border-radius:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  z-index:100;
}
/* Wide invisible touch target; only the metallic edge is visible. */
.side-button::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:4px;
  height:100%;
  background:linear-gradient(90deg,#75697f,#b3a6bc);
  border-radius:2px 0 0 2px;
  pointer-events:none;
}
.side-button:active::after{
  background:linear-gradient(90deg,#a9e8bd,#80cba3);
}

.volume-button{
  position:absolute;
  right:-5px;
  top:17%;
  width:4px;
  height:48px;
  background:#a395ae;
  border-radius:0 3px 3px 0;
}

/* Screen power state */

.screen-off{
  position:absolute;
  inset:0;
  background:#000;
  z-index:30;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

.phone.off .screen-off{
  opacity:1;
  pointer-events:auto;
}

.phone.off .camera-hole{
  z-index:31;
}

.phone.off .status,
.phone.off .gesture{
  visibility:hidden;
}

@media(max-width:500px){
  .phone{
    border-radius:12px;
  }
}
  
/* Fingerprint authentication */
.fingerprint-hint{
  position:absolute;
  right:12px;
  top:34%;
  display:flex;
  align-items:center;
  gap:8px;
  color:white;
  font-size:11px;
  opacity:0;
  transform:translateX(8px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;
  z-index:20;
}

.fingerprint-hint.show{
  opacity:1;
  transform:translateX(0);
}

.fingerprint-hint svg{
  width:28px;
  height:28px;
}

.phone.scanning .side-button::after{
  background:#b9f1ce;
  box-shadow:0 0 12px #8ee7b2;
}

.unlock-home{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  color:white;
  background:rgba(20,17,29,.55);
  backdrop-filter:blur(18px);
  text-align:center;
}

.phone.unlocked .unlock-home{
  display:flex;
}

.unlock-home h2{
  margin:0;
  font-size:22px;
}

.unlock-home p{
  margin:0;
  font-size:13px;
  opacity:.8;
}

<script>
'use strict';
const $=id=>document.getElementById(id);
const phone=$('phone'), screenOff=$('screenOff');
let page='home', scanning=false, scanTimer=null, clockTab='alarms', foodCat='thai', foodChoice='ข้าวผัดไข่';
let gameMinute=421, alarmOpen=false, breakfastStarted=true, notificationSent=false, chatRead=false, selectedChat='nanny', foodOrdered=false;
let alarmTone=null;
const saveKey='polcasan-phone-week-v1';
let alarms=[{time:'07:00',label:'ตื่นไปโรงเรียน',days:[1,2,3,4,5],on:true},{time:'09:00',label:'ตื่นวันหยุด',days:[0,6],on:true}];
const names={nanny:'แม่นมนิว',tay:'ปะป๊าเต',new:'พ่อพ่อนิววี่'};
const avatars={nanny:'น',tay:'ต',new:'น'};
let chats={nanny:[{from:'in',text:'อรุณสวัสดิ์ค่ะคุณหนูซัง ตื่นหรือยังคะ',time:'07:01'},{from:'in',text:'เช้านี้คุณหนูอยากทานอะไรดีคะ แม่นมจะเตรียมให้ค่ะ',time:'07:01'}],tay:[{from:'in',text:'ซังครับ วันนี้ไปโรงเรียนอย่าดื้อนะครับ',time:'เมื่อวาน'}],new:[{from:'in',text:'ฝันดีนะค้าบลูกซัง พรุ่งนี้เจอกันนะ',time:'เมื่อวาน'}]};
function timeStr(){return String(Math.floor(gameMinute/60)%24).padStart(2,'0')+':'+String(gameMinute%60).padStart(2,'0')}
function syncTime(){
 const now=new Date();
 const t=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
 const d=now.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('time').textContent=t;


 $('date').textContent=d;
}
function persist(){try{localStorage.setItem(saveKey,JSON.stringify({gameMinute,breakfastStarted,notificationSent,chatRead,foodOrdered,alarms,chats}))}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem(saveKey)||'null');if(!x)return;gameMinute=x.gameMinute??420;breakfastStarted=!!x.breakfastStarted;notificationSent=!!x.notificationSent;chatRead=!!x.chatRead;foodOrdered=!!x.foodOrdered;if(Array.isArray(x.alarms))alarms=x.alarms;if(x.chats)chats=x.chats;}catch(e){}}
function soundAlarm(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;alarmTone=new C();const osc=alarmTone.createOscillator(),gain=alarmTone.createGain();osc.type='sine';osc.frequency.value=790;gain.gain.value=.07;osc.connect(gain);gain.connect(alarmTone.destination);osc.start();setTimeout(()=>{try{osc.stop()}catch(e){}},500)}catch(e){}}
function stopAlarm(){if(alarmTone){alarmTone.close().catch(()=>{});alarmTone=null}}
function showAlarm(){alarmOpen=true;$('ringTime').textContent=timeStr();$('alarmFull').classList.add('show');soundAlarm()}
function dismissAlarm(){stopAlarm();alarmOpen=false;$('alarmFull').classList.remove('show');breakfastStarted=true;gameMinute=Math.max(gameMinute,421);syncTime();persist();setTimeout(sendMorningNotification,450)}
function sendMorningNotification(){/* Notifications disabled; LINE conversations remain accessible. */}
function unlock(){ $('pinScreen').classList.remove('show');phone.classList.remove('off');phone.classList.add('unlocked');openPage('home');}
let enteredPin='';
function updatePinDots(){ $('pinDots').innerHTML=Array.from({length:6},(_,i)=>'<i class="'+(i<enteredPin.length?'filled':'')+'"></i>').join(''); }
function showPin(){if(alarmOpen||phone.classList.contains('unlocked'))return;enteredPin='';$('pinError').textContent='';updatePinDots();$('pinScreen').classList.add('show');}
function verifyPin(){if(enteredPin==='203006'){unlock();return;}$('pinError').textContent='รหัส PIN ไม่ถูกต้อง';enteredPin='';updatePinDots();}
$('pinKeypad').querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>{if(enteredPin.length>=6)return;enteredPin+=b.dataset.digit;$('pinError').textContent='';updatePinDots();if(enteredPin.length===6)verifyPin();}));
$('pinDelete').addEventListener('click',()=>{enteredPin=enteredPin.slice(0,-1);$('pinError').textContent='';updatePinDots();});
$('pinConfirm').addEventListener('click',()=>{if(enteredPin.length===6)verifyPin();else $('pinError').textContent='กรุณาใส่ PIN 6 หลัก';});
$('pinEmergency').addEventListener('click',()=>{$('pinError').textContent='โหมดจำลอง ไม่สามารถโทรฉุกเฉินได้';});
updatePinDots();
// Swipe upward anywhere on the lock screen to unlock.
// Touch events are used for iOS Safari; mouse events support desktop testing.
const lockScreen=document.querySelector('.screen');
let swipeStart=null;
function canSwipeUnlock(){
  return !alarmOpen && !$('pinScreen').classList.contains('show') && !phone.classList.contains('unlocked') &&
         !phone.classList.contains('off');
}
function startSwipe(y,target){
  if(!canSwipeUnlock() || (target && target.closest('#carrier')))return;
  swipeStart=y;
}
function finishSwipe(y){
  if(swipeStart===null)return;
  const delta=swipeStart-y;
  swipeStart=null;
  if(canSwipeUnlock() && delta>=55)showPin();
}
lockScreen.addEventListener('touchstart',e=>{
  if(e.touches.length===1)startSwipe(e.touches[0].clientY,e.target);
},{passive:true});
lockScreen.addEventListener('touchmove',e=>{
  if(swipeStart!==null && canSwipeUnlock() && e.cancelable)e.preventDefault();
},{passive:false});
lockScreen.addEventListener('touchend',e=>{
  if(e.changedTouches.length)finishSwipe(e.changedTouches[0].clientY);
},{passive:true});
lockScreen.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
lockScreen.addEventListener('mousedown',e=>{if(e.button===0)startSwipe(e.clientY,e.target)});
window.addEventListener('mouseup',e=>finishSwipe(e.clientY));
screenOff.addEventListener('click',()=>phone.classList.remove('off'));
// Hold the carrier name for 1.2 seconds to reset; short taps do nothing.
const carrier=$('carrier');
carrier.setAttribute('title','กดค้างเพื่อรีเซ็ตเกม');
carrier.setAttribute('role','button');
carrier.setAttribute('tabindex','0');
carrier.style.touchAction='none';
carrier.style.userSelect='none';
carrier.style.webkitUserSelect='none';
function resetGame(){
  if(!window.confirm('รีเซ็ต POLCASAN’S PHONE และเริ่มเกมใหม่ทั้งหมดใช่ไหม?'))return;
  try{localStorage.removeItem(saveKey)}catch(e){}
  window.location.reload();
}
let resetHoldTimer=null;
function beginResetHold(e){
  if(e.type==='pointerdown' && e.button!==undefined && e.button!==0)return;
  clearTimeout(resetHoldTimer);
  resetHoldTimer=setTimeout(()=>{resetHoldTimer=null;resetGame()},1200);
}
function cancelResetHold(){clearTimeout(resetHoldTimer);resetHoldTimer=null}
carrier.addEventListener('pointerdown',beginResetHold);
['pointerup','pointercancel','pointerleave'].forEach(ev=>carrier.addEventListener(ev,cancelResetHold));
carrier.addEventListener('contextmenu',e=>e.preventDefault());
carrier.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();beginResetHold({type:'keyboard'})}});
carrier.addEventListener('keyup',cancelResetHold);
function openPage(next){page=next;document.querySelectorAll('.app-page').forEach(el=>el.classList.toggle('active',el.id==='page-'+next));if(next==='clock')renderClock();if(next==='line')renderChats();if(next==='food')renderFood();}
function renderClock(){document.querySelectorAll('[data-clocktab]').forEach(b=>b.classList.toggle('active',b.dataset.clocktab===clockTab));$('addAlarm').style.display=clockTab==='alarms'?'block':'none';const c=$('clockContent');if(clockTab!=='alarms'){const text={world:'กรุงเทพมหานคร · '+timeStr(),stopwatch:'00:00.00',timer:'00:00:00'};c.innerHTML='<div class="clock-extra"><div style="font-size:42px;margin-bottom:16px">'+text[clockTab]+'</div><button class="primary-action" id="clockToolBtn">'+(clockTab==='world'?'เพิ่มเมือง':'เริ่ม')+'</button><div id="clockToolResult" style="margin-top:15px"></div></div>';const b=$('clockToolBtn');b.onclick=()=>{if(clockTab==='world'){$('clockToolResult').textContent='กรุงเทพมหานคร · ประเทศไทย'}else{$('clockToolResult').textContent='เริ่มใช้งาน '+(clockTab==='timer'?'ตั้งเวลา':'จับเวลา');}};return}
 c.innerHTML=alarms.map((a,i)=>'<div class="alarm-card"><div class="alarm-top"><div role="button" tabindex="0" data-edit-alarm="'+i+'"><div class="alarm-time">'+a.time+'</div><div class="alarm-label">'+escapeHtml(a.label)+'</div></div><button class="switch '+(a.on?'on':'')+'" data-toggle-alarm="'+i+'" aria-label="เปิดปิดนาฬิกาปลุก" aria-pressed="'+a.on+'"></button></div><div class="alarm-days">'+['อา','จ','อ','พ','พฤ','ศ','ส'].map((d,n)=>'<span class="'+(a.days.includes(n)?'on':'')+'">'+d+'</span>').join('')+'</div></div>').join('');
 c.querySelectorAll('[data-toggle-alarm]').forEach(b=>b.onclick=()=>{const a=alarms[+b.dataset.toggleAlarm];a.on=!a.on;persist();renderClock()});c.querySelectorAll('[data-edit-alarm]').forEach(b=>b.onclick=()=>editAlarm(+b.dataset.editAlarm));}
let editAlarmIndex=-1;
function editAlarm(i){editAlarmIndex=i;const a=alarms[i];$('newAlarmTime').value=a?.time||'08:00';$('newAlarmName').value=a?.label||'นาฬิกาปลุก';$('alarmModal').classList.add('show')}
$('addAlarm').onclick=()=>editAlarm(-1);$('cancelAlarm').onclick=()=>$('alarmModal').classList.remove('show');$('saveAlarm').onclick=()=>{const a={time:$('newAlarmTime').value||'08:00',label:$('newAlarmName').value||'นาฬิกาปลุก',days:[0,1,2,3,4,5,6],on:true};if(editAlarmIndex<0)alarms.push(a);else alarms[editAlarmIndex]={...alarms[editAlarmIndex],time:a.time,label:a.label};$('alarmModal').classList.remove('show');persist();renderClock()};
document.querySelectorAll('[data-clocktab]').forEach(b=>b.onclick=()=>{clockTab=b.dataset.clocktab;renderClock()});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatarSVG(id){return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-8 16-8 16 0"/></svg>'}
function renderChats(){const order=['nanny','tay','new'];$('chatList').innerHTML=order.map(id=>{const last=chats[id][chats[id].length-1];return '<button class="chat-item" data-chat="'+id+'"><span class="avatar">'+avatars[id]+'</span><span class="chat-copy"><div class="chat-name">'+names[id]+'</div><div class="chat-last">'+escapeHtml(last?.text||'')+'</div></span><span class="chat-meta">'+(id==='nanny'&&notificationSent?'07:01':'เมื่อวาน')+(id==='nanny'&&notificationSent&&!chatRead?'<br><span class="unread">2</span>':'')+'</span></button>'}).join('');$('chatList').querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat))}
function openChat(id){selectedChat=id;if(id==='nanny'){chatRead=true;$('lineToast').classList.remove('show');persist()}$('chatTitle').textContent=names[id];openPage('chat');renderMessages()}
function renderMessages(){const wrap=$('chatMessages');wrap.innerHTML='<div class="chat-date">'+(selectedChat==='nanny'?'วันนี้':'เมื่อวาน')+'</div>'+chats[selectedChat].map(m=>'<div class="bubble '+(m.from==='out'?'out':'in')+'">'+escapeHtml(m.text)+'</div>').join('');wrap.scrollTop=wrap.scrollHeight;const choices=$('chatChoices');if(selectedChat==='nanny'&&!foodOrdered){choices.style.display='flex';choices.innerHTML='<button id="breakfastReply">ซังอยากกินของอร่อย ๆ ค้าบบบ</button><button id="breakfastMenu">เลือกเมนูอาหารเช้า</button>';$('breakfastReply').onclick=()=>{sendMessage('ซังอยากกินของอร่อย ๆ ค้าบบบ');addReply('ได้เลยค่ะคุณหนู เลือกเมนูที่อยากทานได้เลยนะคะ')};$('breakfastMenu').onclick=()=>openPage('food')}else{choices.style.display='none'}}
function sendMessage(text){if(!text.trim())return;chats[selectedChat].push({from:'out',text:text.trim(),time:timeStr()});$('chatInput').value='';persist();renderMessages()}
function addReply(text){chats[selectedChat].push({from:'in',text,time:timeStr()});persist();renderMessages()}
$('sendChat').onclick=()=>sendMessage($('chatInput').value);$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage(e.target.value)});
$('lineToast').onclick=()=>{if(alarmOpen)return;if(!phone.classList.contains('unlocked'))return;openChat('nanny')};
const foods={thai:[['ข้าวผัดไข่','','ผัดข้าวและไข่'],['ข้าวต้มหมู','','ต้มข้าวกับหมู'],['ไข่เจียวหมูสับ','','ตีไข่แล้วทอด'],['ผัดกะเพราหมู','','ผัดหมูและกะเพรา']],world:[['แพนเค้ก','','ผสมแป้งและทอด'],['สปาเกตตี','','ต้มเส้นและทำซอส'],['แซนด์วิช','','ประกอบขนมปัง'],['ออมเล็ต','','ตีไข่และพับไข่']]};
function svgFoodIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18M5 18c0-7 3-11 7-11s7 4 7 11M12 4v3"/></svg>'}
function renderFood(){document.querySelectorAll('[data-foodcat]').forEach(b=>b.classList.toggle('active',b.dataset.foodcat===foodCat));$('foodGrid').innerHTML=foods[foodCat].map(([name,symbol,desc])=>'<button class="food-tile '+(foodChoice===name?'selected':'')+'" data-food="'+name+'"><span class="food-symbol">'+symbol+'</span><strong>'+name+'</strong><small>'+desc+'</small></button>').join('');$('foodGrid').querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{foodChoice=b.dataset.food;renderFood()})}
document.querySelectorAll('[data-foodcat]').forEach(b=>b.onclick=()=>{foodCat=b.dataset.foodcat;foodChoice=foods[foodCat][0][0];renderFood()});
$('chooseFood').onclick=()=>{foodOrdered=true;selectedChat='nanny';chats.nanny.push({from:'out',text:'ซังอยากกิน'+foodChoice+'ค้าบบบ',time:timeStr()});chats.nanny.push({from:'in',text:'ได้เลยค่ะคุณหนู แม่นมจะเตรียม'+foodChoice+'ให้นะคะ',time:timeStr()});persist();openChat('nanny')};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPage(b.dataset.open));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>openPage(b.dataset.back));
$('navHome').onclick=()=>{openPage('home');hideNav()};$('navBack').onclick=()=>openPage(page==='chat'?'line':page==='food'?'chat':'home');$('navRecent').onclick=()=>openPage('home');
$('dismissAlarm').onclick=dismissAlarm;$('snoozeAlarm').onclick=()=>{stopAlarm();$('alarmFull').classList.remove('show');gameMinute+=5;syncTime();persist();setTimeout(showAlarm,900)};
$('clockMore').onclick=()=>alert('ตั้งค่านาฬิกา · POLCASAN’S PHONE');$('lineSearch').onclick=()=>{const q=prompt('ค้นหาแชท');if(q){openPage('line');document.querySelectorAll('.chat-item').forEach(el=>el.style.display=el.textContent.includes(q)?'flex':'none')}};
$('lineAdd').onclick=()=>alert('รายชื่อเพื่อนจะปลดล็อกเพิ่มเติมตามตารางของซัง');$('chatCall').onclick=()=>alert('ระบบโทร LINE จะเปิดในภารกิจถัดไป');$('chatMenu').onclick=()=>alert('ข้อมูลห้องสนทนา');$('chatPlus').onclick=()=>alert('รูปภาพและสติกเกอร์จะปลดล็อกในภารกิจถัดไป');
document.querySelectorAll('[data-line-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.lineTab==='chats')renderChats();else if(b.dataset.lineTab==='friends')alert('เพื่อน: แม่นมนิว, ปะป๊าเต, พ่อพ่อนิววี่');else alert('แท็บนี้จะเปิดในภารกิจถัดไป')});

let navTimer=null;
function hideNav(){document.querySelector('.app-nav').classList.remove('nav-visible');clearTimeout(navTimer)}
function revealNav(){if(!phone.classList.contains('unlocked'))return;document.querySelector('.app-nav').classList.add('nav-visible');clearTimeout(navTimer);navTimer=setTimeout(hideNav,4500)}
let navTouchY=null;
const shell=$('appShell');
shell.addEventListener('touchstart',e=>{if(e.touches.length===1)navTouchY=e.touches[0].clientY},{passive:true});
shell.addEventListener('touchend',e=>{if(navTouchY===null)return;const delta=navTouchY-e.changedTouches[0].clientY;if(navTouchY>shell.getBoundingClientRect().bottom-115&&delta>45)revealNav();navTouchY=null},{passive:true});
let navMouseY=null;
shell.addEventListener('mousedown',e=>{navMouseY=e.clientY});
shell.addEventListener('mouseup',e=>{if(navMouseY!==null&&navMouseY>shell.getBoundingClientRect().bottom-115&&navMouseY-e.clientY>45)revealNav();navMouseY=null});
$('chatSticker').onclick=()=>{};

restore();alarmOpen=false;breakfastStarted=true;gameMinute=Math.max(gameMinute,421);syncTime();setInterval(syncTime,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTime()});openPage('home');$('lineToast').classList.remove('show')
</script>
