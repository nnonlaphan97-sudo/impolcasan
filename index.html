<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>POLCASAN'S PHONE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#293342,#0b0e14 75%);font-family:Arial,'Noto Sans Thai',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px 10px;gap:14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center}.toolbar button{background:#28384c;color:#fff;border:1px solid #536c86;border-radius:20px;padding:10px 18px;cursor:pointer}.toolbar button:hover{background:#3c5672}.device{position:relative;width:350px;height:710px;background:linear-gradient(115deg,#798392,#161d27 8%,#0a0c10 94%,#6c7887);border:3px solid #626c7b;border-radius:39px;padding:8px;box-shadow:0 25px 65px #0009, inset 2px 0 2px #ffffff44;transition:width .45s,height .45s}.device.open{width:700px;height:710px;border-radius:30px}.device:before{content:'';position:absolute;left:-5px;top:125px;width:4px;height:75px;background:#707c8d;border-radius:4px}.device:after{content:'';position:absolute;right:-5px;top:172px;width:4px;height:65px;background:#707c8d;border-radius:4px}.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#c7dff0;color:#1d324c}.open .screen{border-radius:22px}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 28%,#fff9 0,transparent 36%),radial-gradient(ellipse at 25% 77%,#ffb9d5 0,transparent 52%),linear-gradient(155deg,#d3e9f7,#99c5e7 45%,#e8c6e5)}.wall:after{content:'';position:absolute;inset:20% -20% 15%;border:48px solid #ffffff42;border-radius:48%;transform:rotate(-28deg);pointer-events:none}.camera{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#0c1721;box-shadow:inset 0 0 0 3px #253545;z-index:12}.status{position:absolute;top:0;left:0;right:0;height:35px;display:flex;justify-content:space-between;align-items:center;padding:0 19px;z-index:10;font-size:12px;font-weight:650;color:#243c55;cursor:pointer}.status .right{display:flex;align-items:center;gap:5px}.status svg{width:17px;height:17px}.page{position:absolute;inset:35px 0 25px;z-index:2;display:none}.page.active{display:flex;flex-direction:column}.nav{position:absolute;bottom:0;height:25px;width:100%;display:grid;place-items:center;z-index:15;cursor:pointer}.nav span{height:4px;width:105px;border-radius:10px;background:#263c52}.lock{align-items:center;justify-content:space-between;padding:45px 22px 34px;text-align:center}.lock h1{font-size:66px;font-weight:300;letter-spacing:-3px;margin:6px}.lock p{margin:0;font-size:15px}.lock .mascot{width:min(75%,310px);filter:drop-shadow(0 14px 18px #5a82a344)}.unlock{background:#ffffff9c;border:1px solid #fff9;border-radius:25px;padding:13px 26px;font-size:14px;color:#34526f;cursor:pointer}.pinpage{align-items:center;justify-content:center;gap:24px}.pinpage h2{font-size:20px;font-weight:500}.dots{display:flex;gap:20px}.dots i{width:12px;height:12px;border:2px solid #35526e;border-radius:50%}.dots i.on{background:#35526e}.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:13px}.keypad button{width:70px;height:70px;border:0;border-radius:50%;background:#ffffffa0;font-size:26px;color:#263c56;cursor:pointer}.home{padding:27px 20px 15px;gap:22px}.homeTop{display:flex;flex-direction:column;gap:3px}.homeTop .time{font-size:48px;font-weight:300}.search{background:#ffffffaa;border-radius:24px;padding:12px 15px;color:#708499;font-size:13px;cursor:pointer}.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 10px;justify-items:center}.appicon{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:#2d4561;font-size:11px;min-width:0}.tile{height:59px;width:59px;border-radius:18px;display:grid;place-items:center;box-shadow:0 3px 7px #526f8c25}.tile svg{width:32px;height:32px;stroke:white;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.dock{margin-top:auto;background:#ffffff91;border-radius:25px;padding:13px 12px;display:flex;justify-content:space-around}.dock .tile{width:54px;height:54px}.appview{background:#fff;color:#17283b;padding:18px 19px;gap:15px}.appheader{display:flex;align-items:center;justify-content:space-between}.appheader h2{margin:0;font-size:25px}.back{border:0;background:none;font-size:24px;cursor:pointer;color:#263b51}.line-tabs{display:flex;gap:20px;border-bottom:1px solid #e4e7ec;padding-bottom:12px}.line-tabs button{border:0;background:none;color:#667688;font-size:14px;padding:8px;cursor:pointer}.line-tabs button.selected{border-bottom:3px solid #06c755;color:#152b42;font-weight:700}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:#8796a5;font-size:14px}.empty svg{width:58px;height:58px;stroke:#b1bfcb;fill:none;stroke-width:1.4}.dialNumber{font-size:26px;min-height:44px;text-align:center;margin-top:auto;word-break:break-all}.dialkeys{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:12px}.dialkeys button{height:62px;border:0;background:#f2f5f8;border-radius:50%;font-size:25px;color:#253c54;cursor:pointer}.callbtn{border:0;background:#25b76d;color:#fff;border-radius:50%;height:60px;width:60px;font-size:24px;align-self:center;cursor:pointer}.hangup{background:#e94d59}.callview{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}.setting{background:#f3f5f8;padding:16px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.setting button{border:0;border-radius:14px;padding:9px 12px;background:#dbe6f4;color:#284966;cursor:pointer}.shade{position:absolute;z-index:20;inset:0;background:#f1f5fa;color:#22374c;padding:52px 20px;display:none}.shade.show{display:block}.shade button{border:0;background:#d6e3f3;border-radius:18px;padding:15px;cursor:pointer}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shade input{width:100%}.foldline{display:none}.open .foldline{display:block;position:absolute;z-index:11;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(90deg,#0001,#fff3,#0001);pointer-events:none}.open .home .icons{grid-template-columns:repeat(6,minmax(0,1fr))}.open .home{padding-left:40px;padding-right:40px}.open .lock .mascot{max-height:330px}.open .appview{padding-left:38px;padding-right:38px}.hint{font-size:12px;color:#aebdce;text-align:center;max-width:700px}@media(max-width:740px){.device.open{width:min(96vw,650px);height: min(96vw,650px)}.device:not(.open){width:min(94vw,350px)}.open .tile{width:48px;height:48px}.open .home .icons{gap:10px}.open .homeTop .time{font-size:36px}.open .lock h1{font-size:48px}.open .lock{padding-top:15px}.open .lock .mascot{width:180px}.open .home{gap:12px}.open .dock{padding:7px}.open .appview{gap:8px}.open .dialkeys button{height:42px}.open .dialkeys{gap:4px}}
</style></head><body>
<div class="toolbar"><button id="foldBtn" onclick="toggleFold()">▣ กางหน้าจอด้านใน</button><button onclick="power()">⏻ ล็อกหน้าจอ</button><button onclick="goHome()">⌂ หน้าหลัก</button></div>
<div class="device" id="device"><div class="screen"><div class="wall"></div><div class="camera"></div><div class="foldline"></div>
<div class="status" onclick="toggleShade()"><span id="clockSmall">08:18</span><span class="right"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 20h4v-5H2zm6 0h4v-9H8zm6 0h4V7h-4zm6 0h3V3h-3z"/></svg><svg viewBox="0 0 24 24"><path d="M2 9Q12 0 22 9M5 13q7-7 14 0M9 17q3-3 6 0" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="12" cy="20" r="1.5" fill="currentColor"/></svg><svg viewBox="0 0 27 24"><rect x="1" y="4" width="22" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="7" width="16" height="10" rx="1" fill="currentColor"/><rect x="24" y="9" width="2" height="6" rx="1" fill="currentColor"/></svg></span></div>
<div class="page lock active" id="lock"><div><div style="font-size:17px">⌑</div><h1 id="clockLarge">08:18</h1><p id="dateText">วันเสาร์ที่ 21 พฤศจิกายน</p></div><svg class="mascot" viewBox="0 0 300 300" aria-label="วอลเปเปอร์มาสคอตซังแบบ SVG"><defs><linearGradient id="fur" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f1fa"/></linearGradient></defs><ellipse cx="150" cy="268" rx="102" ry="14" fill="#6e98b1" opacity=".18"/><ellipse cx="92" cy="79" rx="37" ry="48" fill="url(#fur)" stroke="#bfd7e7" stroke-width="4"/><ellipse cx="208" cy="79" rx="37" ry="48" fill="url(#fur)" stroke="#bfd7e7" stroke-width="4"/><ellipse cx="92" cy="80" rx="20" ry="28" fill="#f4c4d9"/><ellipse cx="208" cy="80" rx="20" ry="28" fill="#f4c4d9"/><ellipse cx="150" cy="170" rx="116" ry="105" fill="url(#fur)" stroke="#bfd7e7" stroke-width="4"/><ellipse cx="104" cy="164" rx="7" ry="10" fill="#3c536a"/><ellipse cx="196" cy="164" rx="7" ry="10" fill="#3c536a"/><circle cx="102" cy="161" r="2.4" fill="white"/><circle cx="194" cy="161" r="2.4" fill="white"/><ellipse cx="150" cy="198" rx="25" ry="19" fill="#fbe7eb"/><ellipse cx="150" cy="192" rx="9" ry="6" fill="#556679"/><path d="M150 198q-10 20-22 8m22-8q10 20 22 8" fill="none" stroke="#556679" stroke-width="3" stroke-linecap="round"/><ellipse cx="87" cy="197" rx="17" ry="9" fill="#f7c8dc"/><ellipse cx="213" cy="197" rx="17" ry="9" fill="#f7c8dc"/><path d="M119 244q31 20 62 0" fill="none" stroke="#efabc9" stroke-width="8" stroke-linecap="round"/></svg><button class="unlock" onclick="show('pinpage')">ปัดขึ้นเพื่อปลดล็อก ↑</button></div>
<div class="page pinpage" id="pinpage"><h2>ใส่ PIN</h2><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="keypad" id="pinKeys"></div><small>ทดลอง: กดเลข 4 หลักใดก็ได้</small></div>
<div class="page home" id="home"><div class="homeTop"><span id="homeDate">วันเสาร์ที่ 21 พ.ย.</span><span class="time" id="homeTime">08:18</span></div><div class="search" onclick="toggleDrawer()">⌕ &nbsp; ค้นหาแอป</div><div class="icons" id="homeIcons"></div><div class="dock" id="dock"></div></div>

<script>
const $=id=>document.getElementById(id);let current='lock',pin='',dial='',inCall=false,drawer=false,lineTab='แชต',wall='sky';const iconPaths={line:'<path d="M6 18 4 21v-6a9 9 0 1 1 4 4Z"/><path d="M8 11h8M8 14h5"/>',phone:'<path d="M7 3 4 5c-1 6 9 16 15 15l2-3-5-4-3 3c-3-1-5-3-6-6l3-3Z"/>',contacts:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-7 16-7 16 0"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 2 1 3-1 2 4-2 2v2l2 2-2 4-3-1-2 1-1 3h-4l-1-3-2-1-3 1-2-4 2-2v-2L2 9l2-4 3 1 2-1Z"/>'};const apps=[{id:'line',name:'LINE',color:'#06c755'},{id:'phone',name:'โทรศัพท์',color:'#39bd83'},{id:'contacts',name:'รายชื่อ',color:'#f1ad7c'},{id:'settings',name:'การตั้งค่า',color:'#9aa9be'}];function svgIcon(id){return `<svg viewBox="0 0 24 24">${iconPaths[id]}</svg>`}function appButton(a){return `<button class="appicon" onclick="openApp('${a.id}')"><span class="tile" style="background:${a.color}">${svgIcon(a.id)}</span><span>${a.name}</span></button>`}function renderHome(){const list=drawer?apps:apps;$('homeIcons').innerHTML=list.map(appButton).join('');$('dock').innerHTML=[apps[1],apps[0],apps[2]].map(a=>`<button class="appicon" onclick="openApp('${a.id}')"><span class="tile" style="background:${a.color}">${svgIcon(a.id)}</span></button>`).join('')}function show(id){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');current=id;$('shade').classList.remove('show')}function goHome(){show('home');pin='';inCall=false;renderHome()}function power(){show('lock');pin=''}function toggleFold(){const open=$('device').classList.toggle('open');$('foldBtn').textContent=open?'▯ พับหน้าจอ':'▣ กางหน้าจอด้านใน'}function toggleShade(){$('shade').classList.toggle('show')}function toggleDrawer(){drawer=!drawer;renderHome()}function pressPin(n){if(n==='del')pin=pin.slice(0,-1);else pin+=n;document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('on',i<pin.length));if(pin.length>=4)setTimeout(goHome,180)}$('pinKeys').innerHTML=['1','2','3','4','5','6','7','8','9','','0','del'].map(n=>n?`<button onclick="pressPin('${n}')">${n==='del'?'⌫':n}</button>`:'<div></div>').join('');function openApp(id){show('appview');$('appTitle').textContent=apps.find(a=>a.id===id).name;const c=$('appContent');if(id==='line'){c.innerHTML=`<div class="line-tabs">${['แชต','เพื่อน','หน้าหลัก'].map(t=>`<button class="${lineTab===t?'selected':''}" onclick="lineTab='${t}';openApp('line')">${t}</button>`).join('')}</div><div class="search">⌕ &nbsp; ค้นหา</div><div class="empty">${svgIcon('line')}<span>ยังไม่มีข้อมูล</span></div>`}else if(id==='phone')renderPhone();else if(id==='contacts'){c.innerHTML=`<div class="search">⌕ &nbsp; ค้นหารายชื่อ</div><div class="empty">${svgIcon('contacts')}<span>ยังไม่มีรายชื่อ</span></div>`}else{c.innerHTML=`<div class="setting"><span>วอลเปเปอร์</span><span><button onclick="setWall('sky')">ฟ้า</button> <button onclick="setWall('pink')">ชมพู</button></span></div><div class="setting"><span>ระบบ</span><span>POLCA UI 1.0</span></div><div class="setting"><span>เสียงและการสั่น</span><button onclick="this.textContent=this.textContent==='เปิด'?'ปิด':'เปิด'">เปิด</button></div>`}}function setWall(t){wall=t;document.querySelector('.wall').style.background=t==='pink'?'radial-gradient(ellipse at 70% 30%,#fff9,transparent 40%),linear-gradient(145deg,#f8e3ed,#e9b5cf 55%,#e5d9f4)':'radial-gradient(ellipse at 80% 28%,#fff9 0,transparent 36%),radial-gradient(ellipse at 25% 77%,#ffb9d5 0,transparent 52%),linear-gradient(155deg,#d3e9f7,#99c5e7 45%,#e8c6e5)'}function digit(k){dial+=k;renderPhone()}function delDigit(){dial=dial.slice(0,-1);renderPhone()}function renderPhone(){const c=$('appContent');if(inCall){c.innerHTML=`<div class="callview"><div style="font-size:60px;color:#a2b2c2">◯</div><div style="font-size:27px">${dial.replace(/</g,'&lt;')}</div><div style="color:#8798aa">กำลังโทร...</div><button class="callbtn hangup" onclick="inCall=false;renderPhone()">✕</button></div>`;return}c.innerHTML=`<div style="flex:1"></div><div class="dialNumber">${dial.replace(/</g,'&lt;')||'&nbsp;'}</div><div class="dialkeys">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>`<button onclick="digit('${k}')">${k}</button>`).join('')}</div><div style="display:flex;justify-content:center;gap:25px;align-items:center"><button class="callbtn" onclick="if(dial){inCall=true;renderPhone()}">☎</button><button style="border:0;background:none;font-size:24px" onclick="delDigit()">⌫</button></div>`}function clock(){const d=new Date();const t=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});['clockSmall','clockLarge','homeTime'].forEach(id=>$(id).textContent=t);$('dateText').textContent=d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});$('homeDate').textContent=d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'})}renderHome();clock();setInterval(clock,30000);document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Home')goHome();if(current==='pinpage'&&/^\d$/.test(e.key))pressPin(e.key)});
</script></body></html>
